<div class="auth-screen" id="auth-screen">
      <form class="auth-card" id="auth-form">
        <div class="auth-logo">
          A
        </div>
        <span class="label">MI ALMACÉN</span>
        <h1 id="auth-title">
          Iniciar sesión
        </h1>
        <p class="muted" id="auth-message">
          Ingresa para continuar.
        </p>
        <label class="auth-setup-field">Tu nombre<input id="auth-name" autocomplete="name" /></label><label>Usuario<input id="auth-username" required autocomplete="username" /></label><label>Contraseña<input id="auth-password" required type="password" minlength="8" autocomplete="current-password" /></label>
        <p class="auth-error" id="auth-error" role="alert">
        </p>
        <button class="primary wide" id="auth-submit">
          Entrar
        </button>
      </form>
    </div>
